# A 股监控配置
# 自选股列表：code 为证券代码，market 可选 ashare（默认）/ hk / crypto
watchlist:
  - code: "600519"   # 贵州茅台
    name: "贵州茅台"
  - code: "000001"   # 平安银行
    name: "平安银行"
  - code: "300750"   # 宁德时代
    name: "宁德时代"
  # 港股示例（5 位代码，market: hk）：
  # - code: "00700"    # 腾讯控股
  #   name: "腾讯控股"
  #   market: hk
  # 加密货币示例（币安交易对，market: crypto，7×24 监控）：
  # - code: "BTCUSDT"
  #   name: "比特币"
  #   market: crypto

# 预警规则
alerts:
  # 涨跌幅超过该百分比触发预警（正数为涨幅，负数为跌幅取绝对值）
  change_pct_threshold: 3.0
  # 委比绝对值超过该百分比触发盘口失衡预警（需五档数据，sina/tencent 源支持）
  # 设为 null 或不配置则关闭
  weibi_threshold: 80
  # 单档挂单量（手）超过该值触发大单预警
  big_order_threshold: 5000
  # 当日振幅（(最高-最低)/昨收）超过该百分比触发波动预警
  amplitude_threshold: 5.0
  # 价格突破提醒（可选，按代码配置）
  price_above:
    # "600519": 1800.0
  price_below:
    # "600519": 1500.0

# 监控设置
monitor:
  # 轮询间隔（秒），注意交易时间外无数据更新
  interval_seconds: 30
  # 仅在交易时段运行
  trading_hours_only: true
  # 交易时段（24 小时制）
  trading_sessions:
    - ["09:30", "11:30"]
    - ["13:00", "15:00"]
  # 监控启动时输出自选股历史波动基线
  startup_profile: true
  # 预警触发时附带该股近期波动画像（按交易日缓存，每天每股只拉一次）
  alert_profile: true
  # 画像回看交易日数
  profile_days: 120
  # 收盘后自动生成复盘报告（output/review-YYYY-MM-DD.html）
  auto_review: true

# 行情数据源（按顺序降级，首个可用的生效）
# sina / tencent：按需查询、速度快，适合盘中轮询（借鉴自 easyquotation）
# eastmoney：全市场快照、字段最全，作为兜底
quotes:
  sources: ["sina", "tencent", "eastmoney"]

# 复盘报告
review:
  # 大盘指数对照（带市场前缀，避免 000001 指数与平安银行冲突）
  indexes: ["sh000001", "sz399001", "sz399006"]
  # 报告内 K 线回看交易日数
  kline_days: 60

# 全市场异动扫描
scan:
  limit: 10          # 每个榜单展示条数
  exclude_st: true   # 剔除 ST
  min_price: 2.0     # 剔除低价股
  volume_ratio: 2.0  # 放量异动量比阈值
  turnover_rate: 5.0 # 高换手阈值（%）

# 交易信号（规则化，仅供参考，不构成投资建议）
signals:
  volume_ratio_high: 1.2  # 量比高于此值视为放量
  volume_ratio_low: 0.8   # 量比低于此值视为缩量
  momentum_window: 20     # 动量回看周期（交易日）
  momentum_pct: 3.0       # 动量强弱阈值（%）

# Obsidian 集成：复盘报告同步导出 Markdown
obsidian:
  vault: ""              # Obsidian 库根目录（留空禁用），例如 D:/Obsidian/MyVault
  reports_dir: "A股复盘"  # 库内复盘子目录

# 日志
logging:
  level: "INFO"
  file: "logs/monitor.log"
