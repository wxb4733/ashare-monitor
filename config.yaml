# A 股监控配置
# 自选股列表：code 为 6 位证券代码
watchlist:
  - code: "600519"   # 贵州茅台
    name: "贵州茅台"
  - code: "000001"   # 平安银行
    name: "平安银行"
  - code: "300750"   # 宁德时代
    name: "宁德时代"

# 预警规则
alerts:
  # 涨跌幅超过该百分比触发预警（正数为涨幅，负数为跌幅取绝对值）
  change_pct_threshold: 3.0
  # 委比绝对值超过该百分比触发盘口失衡预警（需五档数据，sina/tencent 源支持）
  # 设为 null 或不配置则关闭
  weibi_threshold: 80
  # 单档挂单量（手）超过该值触发大单预警
  big_order_threshold: 5000
  # 当日振幅（(最高-最低)/昨收）超过该百分比触发波动预警
  amplitude_threshold: 5.0
  # 价格突破提醒（可选，按代码配置）
  price_above:
    # "600519": 1800.0
  price_below:
    # "600519": 1500.0

# 监控设置
monitor:
  # 轮询间隔（秒），注意交易时间外无数据更新
  interval_seconds: 30
  # 仅在交易时段运行
  trading_hours_only: true
  # 交易时段（24 小时制）
  trading_sessions:
    - ["09:30", "11:30"]
    - ["13:00", "15:00"]

# 行情数据源（按顺序降级，首个可用的生效）
# sina / tencent：按需查询、速度快，适合盘中轮询（借鉴自 easyquotation）
# eastmoney：全市场快照、字段最全，作为兜底
quotes:
  sources: ["sina", "tencent", "eastmoney"]

# 日志
logging:
  level: "INFO"
  file: "logs/monitor.log"
